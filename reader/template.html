<title>__NAME__, Abridged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap">
<style>
:root {
  --paper: #F1F2EE;
  --paper-2: #E6E8E1;
  --ink: #1D2130;
  --ink-soft: #4A4F5E;
  --muted: #7A7E88;
  --rule: #D3D5CD;
  --brass: #8E6420;
  --brass-soft: #EDE3CF;
  --cut: #A7AAB1;
  --serif: "Literata", "Iowan Old Style", Georgia, serif;
  --display: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --measure: 38rem;
  --fs: 1.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #15171D; --paper-2: #1D2029; --ink: #E3E1D8; --ink-soft: #B9B7AF;
    --muted: #868A94; --rule: #2C303A; --brass: #D3A24E; --brass-soft: #2B2518; --cut: #5A5E68;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15171D; --paper-2: #1D2029; --ink: #E3E1D8; --ink-soft: #B9B7AF;
  --muted: #868A94; --rule: #2C303A; --brass: #D3A24E; --brass-soft: #2B2518; --cut: #5A5E68;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--serif); font-size: var(--fs); line-height: 1.7; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 3px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  font-family: var(--ui); font-size: 0.9rem; line-height: 1.2;
}
.bar-in {
  max-width: 64rem; margin: 0 auto; padding: 0.6rem 16px;
  display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
}
.ident { display: flex; align-items: center; gap: 0.6rem; margin-right: auto; min-width: 0; }
.brand { font-family: var(--display); font-weight: 600; font-size: 1.25rem; letter-spacing: 0.01em; white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; }
.lib-link { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); background: var(--paper-2); border-radius: 6px; padding: 0.3rem 0.55rem; white-space: nowrap; }
.lib-link:hover { color: var(--brass); border-color: var(--brass); }
.brand span { color: var(--brass); }
.picker { display: flex; gap: 0.4rem; }
.picker select {
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 6px;
  padding: 0.35rem 0.5rem; max-width: 9.5rem;
}
.seg .sm { display: none; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--paper-2); }
.seg button { border: 0; background: none; padding: 0.3rem 0.75rem; border-radius: 999px; cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.75rem; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.icon-btn { border: 1px solid var(--rule); background: var(--paper-2); border-radius: 6px; padding: 0.3rem 0.55rem; cursor: pointer; }

main { max-width: var(--measure); margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 5rem; }

/* Contents */
.contents h1, .bm-h { font-family: var(--display); font-weight: 500; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; margin: 0 0 0.75rem; text-wrap: balance; }
.lede { color: var(--ink-soft); margin: 0 0 2rem; max-width: 34rem; }
.toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.toc li { border-bottom: 1px solid var(--rule); }
.toc button {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; align-items: baseline;
  background: none; border: 0; padding: 0.8rem 0; text-align: left; cursor: pointer;
}
.toc .t { font-family: var(--display); font-size: 1.4rem; font-weight: 600; }
.toc .m { font-family: var(--ui); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brass); }
.resume { margin: 0 0 2rem; font-family: var(--ui); font-size: 0.9rem; }
.resume button { background: var(--brass-soft); border: 1px solid var(--rule); color: var(--ink); border-radius: 6px; padding: 0.5rem 0.8rem; cursor: pointer; }
.fine { font-family: var(--ui); font-size: 0.8rem; color: var(--muted); margin-top: 2rem; line-height: 1.5; }

/* Chapter */
.eyebrow { font-family: var(--ui); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); margin: 0; }
.chapter h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; margin: 0.2rem 0 0.3rem; }
.count { font-family: var(--ui); font-size: 0.85rem; color: var(--muted); margin: 0 0 2rem; font-variant-numeric: tabular-nums; }
.v { margin: 0 0 0.9rem; }
.v sup { font-family: var(--ui); font-size: 0.68rem; color: var(--brass); font-weight: 500; margin-right: 0.3rem; vertical-align: 0.45em; font-variant-numeric: tabular-nums; }
.v.cut { color: var(--cut); }
.vn {
  font-family: var(--ui); font-size: 0.68rem; font-weight: 500; line-height: 1; color: var(--brass);
  background: none; border: 1px solid transparent; border-radius: 4px; padding: 0.15rem 0.25rem; margin: 0 0.2rem 0 -0.25rem;
  vertical-align: 0.45em; cursor: pointer; font-variant-numeric: tabular-nums;
}
.vn:hover { border-color: var(--rule); }
.v.cut .vn { color: var(--cut); }
.v.marked .vn { background: var(--brass); color: var(--paper); border-color: var(--brass); }
.v.flash { background: var(--brass-soft); border-radius: 4px; box-shadow: 0 0 0 0.4rem var(--brass-soft); }
@media (prefers-reduced-motion: no-preference) { .v { transition: background 1.2s ease, box-shadow 1.2s ease; } }
.bm-btn { display: inline-flex; align-items: center; gap: 0.3rem; }
.bm-btn svg { width: 0.8rem; height: 0.95rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
.bm-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.bm-btn .n { font-variant-numeric: tabular-nums; }
.bms { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.bms li { display: flex; gap: 0.75rem; align-items: flex-start; border-bottom: 1px solid var(--rule); padding: 0.85rem 0; }
.bms .go { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.bms .r { font-family: var(--display); font-size: 1.3rem; font-weight: 600; display: block; }
.bms .x { font-size: 0.95rem; color: var(--ink-soft); display: block; line-height: 1.5; }
.bms .tag { font-family: var(--ui); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.bms .del { font-family: var(--ui); font-size: 0.8rem; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 0.3rem 0.55rem; cursor: pointer; }
.bms .del:hover { color: var(--ink); }
.empty { color: var(--ink-soft); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: flex; gap: 0.9rem; align-items: center; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0.6rem 0.9rem;
  font-family: var(--ui); font-size: 0.9rem; line-height: 1.3; box-shadow: 0 6px 24px rgba(0,0,0,0.18);
}
.toast button { background: none; border: 0; color: var(--brass-soft); font-weight: 500; cursor: pointer; padding: 0; text-decoration: underline; }
.gap {
  font-family: var(--ui); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em;
  margin: 0.2rem 0 1.1rem; display: flex; align-items: center; gap: 0.6rem;
}
.gap::before, .gap::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.bridge { margin: 0.4rem 0 1.4rem; padding: 0.8rem 1rem; background: var(--brass-soft); border-radius: 4px; }
.bridge .lbl { font-family: var(--ui); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); margin: 0 0 0.25rem; }
.bridge p { margin: 0; font-style: italic; font-size: 0.98rem; line-height: 1.55; color: var(--ink-soft); }
.nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); font-family: var(--ui); }
.nav button { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 0.55rem 0.9rem; cursor: pointer; font-size: 0.9rem; }
.nav button:disabled { opacity: 0.35; cursor: default; }
.nav .next { margin-left: auto; }

@media (max-width: 520px) {
  .bar-in { gap: 0.5rem 0.35rem; }
  .picker { gap: 0.3rem; }
  .ident { width: 100%; margin-right: 0; }
  .picker select { max-width: 6rem; padding-inline: 0.3rem; }
  #book { max-width: 5.6rem; }
  #chap { max-width: 4.9rem; }
  .seg .lg { display: none; }
  .seg .sm { display: inline; }
  .seg button { padding: 0.3rem 0.45rem; }
  .bar-in > .icon-btn { padding-inline: 0.45rem; }
}
@media (prefers-reduced-motion: no-preference) {
  main { animation: rise 0.25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="ident">__LIBRARY__<button class="brand" id="home" type="button">__NAME__ <span>Abridged</span></button></div>
    <div class="picker">
      <select id="book" aria-label="Book"></select>
      <select id="chap" aria-label="Chapter"></select>
    </div>
    <div class="seg" role="group" aria-label="Text">
      <button type="button" id="m-abr" aria-pressed="true"><span class="lg">Abridged</span><span class="sm" aria-hidden="true">Abr.</span></button>
      <button type="button" id="m-full" aria-pressed="false">Full</button>
    </div>
    <button class="icon-btn bm-btn" id="bm" type="button" aria-pressed="false" aria-label="Bookmarks"><svg viewBox="0 0 12 15" aria-hidden="true"><path d="M1.5 1.5h9v12L6 10.2 1.5 13.5z"/></svg><span class="n" id="bm-n">0</span></button>
    <button class="icon-btn" id="size" type="button" aria-label="Text size">Aa</button>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" hidden><span id="toast-t"></span><button type="button" id="toast-u">Undo</button></div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  const BOOKS = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const main = $("main"), selBook = $("book"), selChap = $("chap");
  const store = {
    get(k, d) { try { const v = localStorage.getItem("__KEY__:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("__KEY__:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  let mode = store.get("mode", "abr");
  let size = store.get("size", 0);
  const SIZES = ["1.125rem", "1.25rem", "1.0rem"];
  let view = null; // {b, c} or null for contents

  const esc = (s) => s.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[ch]);
  const kept = (vs) => vs.reduce((n, v) => n + v[1], 0);
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  const short = (n) => (BOOKS.find((bk) => bk.n === n) || {}).a || n;

  // Flat index for chapter-crossing gap ranges.
  const flat = [];
  BOOKS.forEach((bk, b) => bk.c.forEach((vs, c) => vs.forEach((v, i) => flat.push([b, c, i]))));
  const pos = new Map(flat.map((p, i) => [p.join(","), i]));
  function refOf(p) { const bk = BOOKS[p[0]]; return short(bk.n) + " " + (p[1] + 1) + ":" + (p[2] + 1); }
  function skippedRange(b, c, i) {
    let j = pos.get([b, c, i].join(",")) - 1, end = j;
    while (j >= 0 && !BOOKS[flat[j][0]].c[flat[j][1]][flat[j][2]][1]) j--;
    if (end < j + 1) return "";
    const a = flat[j + 1], z = flat[end];
    const ra = refOf(a), rz = refOf(z);
    if (ra === rz) return ra;
    if (a[0] === z[0] && a[1] === z[1]) return ra + "–" + (z[2] + 1);
    if (a[0] === z[0]) return ra + "–" + (z[1] + 1) + ":" + (z[2] + 1);
    return ra + " – " + rz;
  }

  BOOKS.forEach((bk, i) => selBook.add(new Option(bk.n, i)));
  selBook.add(new Option("Contents", -1), 0);

  function fillChapters(b) {
    selChap.innerHTML = "";
    if (b < 0) { selChap.hidden = true; return; }
    selChap.hidden = false;
    BOOKS[b].c.forEach((vs, c) => {
      const o = new Option((BOOKS[b].n === "Psalms" ? "Ps. " : "Ch. ") + (c + 1), c);
      if (mode === "abr" && !kept(vs)) o.text += " (skipped)";
      selChap.add(o);
    });
  }

  function setMode(m, quiet) {
    mode = m; store.set("mode", m);
    $("m-abr").setAttribute("aria-pressed", m === "abr");
    $("m-full").setAttribute("aria-pressed", m === "full");
    if (view && !view.bm) { fillChapters(view.b); selChap.value = view.c; }
    if (!quiet) render(false);
  }

  function slug(b, c) { return BOOKS[b].s + "-" + (c + 1); }
  function go(b, c, scroll, v) {
    view = b == null ? null : b === "bm" ? { bm: true } : { b, c };
    if (view && !view.bm) store.set("pos", view);
    const h = !view ? "" : view.bm ? "#bookmarks" : "#" + slug(b, c) + (v != null ? "." + (v + 1) : "");
    try { history.replaceState(null, "", h || location.pathname + location.search); } catch (e) {}
    render(scroll !== false);
  }

  // Bookmarks: {b, c, v, t, ref, slug}; ref and slug let the site's library page list them.
  let marks = store.get("bookmarks", []).filter((m) => BOOKS[m.b] && BOOKS[m.b].c[m.c] && BOOKS[m.b].c[m.c][m.v]);
  const refLabel = (b, c, v) => BOOKS[b].n + " " + (c + 1) + ":" + (v + 1);
  const markIndex = (b, c, v) => marks.findIndex((m) => m.b === b && m.c === c && m.v === v);
  function saveMarks() { store.set("bookmarks", marks); $("bm-n").textContent = marks.length; }
  function toggleMark(b, c, v) {
    const i = markIndex(b, c, v), ref = refLabel(b, c, v);
    if (i >= 0) {
      const old = marks.splice(i, 1)[0];
      toast("Removed " + ref, () => { marks.splice(i, 0, old); saveMarks(); render(false); });
    } else {
      marks.push({ b, c, v, t: Date.now(), ref, slug: slug(b, c) + "." + (v + 1) });
      toast("Bookmarked " + ref, () => { marks.splice(markIndex(b, c, v), 1); saveMarks(); render(false); });
    }
    saveMarks();
    render(false);
  }
  function goVerse(b, c, v) {
    if (mode === "abr" && !BOOKS[b].c[c][v][1]) {
      setMode("full", true);
      toast("Showing the full text: " + refLabel(b, c, v) + " is cut from the abridgement");
    }
    go(b, c, false, v);
    const el = document.getElementById("v-" + v);
    if (!el) return window.scrollTo(0, 0);
    el.scrollIntoView({ block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  }
  function bookmarks() {
    let h = '<section class="bookmarks"><p class="eyebrow">__EYEBROW__</p><h1 class="bm-h">Bookmarks</h1>';
    if (!marks.length) return h + '<p class="empty">Tap a verse number to bookmark that verse. Your bookmarks are saved in this browser.</p></section>';
    h += '<ul class="bms">';
    marks.slice().sort((x, y) => y.t - x.t).forEach((m) => {
      const v = BOOKS[m.b].c[m.c][m.v], txt = v[0].length > 140 ? v[0].slice(0, 137) + "…" : v[0];
      h += '<li><button type="button" class="go" data-b="' + m.b + '" data-c="' + m.c + '" data-v="' + m.v + '"><span class="r">' + esc(m.ref) + "</span>" +
        (v[1] ? "" : '<span class="tag">Cut from the abridgement</span>') + '<span class="x">' + esc(txt) + "</span></button>" +
        '<button type="button" class="del" data-del="' + m.b + "." + m.c + "." + m.v + '" aria-label="Remove ' + esc(m.ref) + '">Remove</button></li>';
    });
    return h + '</ul><p class="fine">Saved in this browser only.</p></section>';
  }
  let toastTimer = 0, toastUndo = null;
  function toast(text, undo) {
    $("toast-t").textContent = text;
    toastUndo = undo || null;
    $("toast-u").hidden = !undo;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 4000);
  }
  $("toast-u").addEventListener("click", () => { if (toastUndo) toastUndo(); toastUndo = null; $("toast").hidden = true; });

  function contents() {
    const total = flat.length;
    const k = BOOKS.reduce((n, bk) => n + bk.c.reduce((m, vs) => m + kept(vs), 0), 0);
    const last = store.get("pos", null);
    let h = '<section class="contents"><p class="eyebrow">__EYEBROW__</p><h1>Half the verses, the whole story</h1>';
    h += '<p class="lede">' + k.toLocaleString() + " of " + total.toLocaleString() + " verses, chosen to keep the narrative moving and the teaching whole. Where a cut would leave you lost, a short note fills in what was skipped. Switch to Full at any time to see every verse, with the cut ones greyed out.</p>";
    if ((last && BOOKS[last.b]) || marks.length) {
      h += '<p class="resume">';
      if (last && BOOKS[last.b]) h += '<button type="button" data-b="' + last.b + '" data-c="' + last.c + '">Continue at ' + esc(BOOKS[last.b].n) + " " + (last.c + 1) + " →</button> ";
      if (marks.length) h += '<button type="button" data-bm="1">' + plural(marks.length, "bookmark") + " →</button>";
      h += "</p>";
    }
    h += '<ul class="toc">';
    BOOKS.forEach((bk, b) => {
      const n = bk.c.reduce((m, vs) => m + vs.length, 0), kk = bk.c.reduce((m, vs) => m + kept(vs), 0);
      const pct = Math.round((100 * kk) / n);
      h += '<li><button type="button" data-b="' + b + '" data-c="0"><span class="t">' + esc(bk.n) + '</span><span class="m">' + kk + " / " + n + " verses · " + pct + "% · " + plural(bk.c.length, "chapter") + '</span><span class="meter"><i style="width:' + pct + '%"></i></span></button></li>';
    });
    h += '</ul><p class="fine">Text: __SOURCE__ via the public-domain scriptures-json project. Selection and bridging notes are an editorial abridgement, not an official edition.</p></section>';
    return h;
  }

  function verse(b, c, i, v) {
    const on = markIndex(b, c, i) >= 0;
    return '<p class="v' + (v[1] ? "" : " cut") + (on ? " marked" : "") + '" id="v-' + i + '"><button type="button" class="vn" data-mark="' + i +
      '" aria-pressed="' + on + '" aria-label="' + (on ? "Remove bookmark from" : "Bookmark") + " verse " + (i + 1) + '">' + (i + 1) + "</button>" + esc(v[0]) + "</p>";
  }

  function chapter(b, c) {
    const bk = BOOKS[b], vs = bk.c[c], k = kept(vs);
    let h = '<article class="chapter"><p class="eyebrow">' + esc(bk.n) + '</p><h1>' + (bk.n === "Psalms" ? "Psalm " : "Chapter ") + (c + 1) + '</h1>';
    h += '<p class="count">' + (mode === "abr" ? k + " of " + plural(vs.length, "verse") + " kept" : plural(vs.length, "verse") + " · " + k + " kept, " + (vs.length - k) + " cut") + "</p>";
    if (mode === "abr" && !k) {
      h += '<div class="gap">All ' + vs.length + " verses skipped</div>";
    }
    let run = 0;
    vs.forEach((v, i) => {
      if (mode === "full") {
        h += verse(b, c, i, v);
        return;
      }
      if (!v[1]) { run++; return; }
      if (v[2]) {
        const r = skippedRange(b, c, i);
        h += '<aside class="bridge"><p class="lbl">Skipped' + (r ? " · " + esc(r) : "") + "</p><p>" + esc(v[2]) + "</p></aside>";
      } else if (run) {
        h += '<div class="gap">' + plural(run, "verse") + " skipped</div>";
      }
      run = 0;
      h += verse(b, c, i, v);
    });
    if (mode === "abr" && run && k) h += '<div class="gap">' + plural(run, "verse") + " skipped</div>";
    const prev = step(b, c, -1), next = step(b, c, 1);
    h += '<nav class="nav">';
    h += '<button type="button" class="prev"' + (prev ? ' data-b="' + prev[0] + '" data-c="' + prev[1] + '"' : " disabled") + ">← " + (prev ? esc(short(BOOKS[prev[0]].n)) + " " + (prev[1] + 1) : "Start") + "</button>";
    h += '<button type="button" class="next"' + (next ? ' data-b="' + next[0] + '" data-c="' + next[1] + '"' : " disabled") + ">" + (next ? esc(short(BOOKS[next[0]].n)) + " " + (next[1] + 1) : "End") + " →</button>";
    h += "</nav></article>";
    return h;
  }

  // Step to the adjacent chapter; in abridged mode skip chapters with nothing kept.
  function step(b, c, d) {
    for (;;) {
      c += d;
      if (c < 0) { b--; if (b < 0) return null; c = BOOKS[b].c.length - 1; }
      else if (c >= BOOKS[b].c.length) { b++; if (b >= BOOKS.length) return null; c = 0; }
      if (mode === "full" || kept(BOOKS[b].c[c])) return [b, c];
    }
  }

  function render(scroll) {
    document.documentElement.style.setProperty("--fs", SIZES[size]);
    $("bm").setAttribute("aria-pressed", !!(view && view.bm));
    if (!view || view.bm) { selBook.value = -1; fillChapters(-1); main.innerHTML = view ? bookmarks() : contents(); }
    else {
      if (+selBook.value !== view.b) { selBook.value = view.b; fillChapters(view.b); }
      selChap.value = view.c;
      main.innerHTML = chapter(view.b, view.c);
    }
    if (scroll) window.scrollTo(0, 0);
  }

  main.addEventListener("click", (e) => {
    const mk = e.target.closest("button[data-mark]");
    if (mk && view && !view.bm) return toggleMark(view.b, view.c, +mk.dataset.mark);
    const del = e.target.closest("button[data-del]");
    if (del) { const [b, c, v] = del.dataset.del.split(".").map(Number); return toggleMark(b, c, v); }
    if (e.target.closest("button[data-bm]")) return go("bm");
    const t = e.target.closest("button[data-b]");
    if (!t) return;
    if (t.dataset.v != null) goVerse(+t.dataset.b, +t.dataset.c, +t.dataset.v);
    else go(+t.dataset.b, +t.dataset.c);
  });
  $("bm").addEventListener("click", () => (view && view.bm ? go(null) : go("bm")));
  selBook.addEventListener("change", () => {
    const b = +selBook.value;
    if (b < 0) return go(null);
    fillChapters(b);
    let c = 0;
    if (mode === "abr") while (c < BOOKS[b].c.length - 1 && !kept(BOOKS[b].c[c])) c++;
    go(b, c);
  });
  selChap.addEventListener("change", () => { if (view && !view.bm) go(view.b, +selChap.value); });
  $("home").addEventListener("click", () => go(null));
  $("m-abr").addEventListener("click", () => setMode("abr"));
  $("m-full").addEventListener("click", () => setMode("full"));
  $("size").addEventListener("click", () => { size = (size + 1) % SIZES.length; store.set("size", size); render(false); });
  document.addEventListener("keydown", (e) => {
    if (!view || view.bm || e.target.closest("select") || e.metaKey || e.ctrlKey || e.altKey) return;
    const s = e.key === "ArrowRight" ? step(view.b, view.c, 1) : e.key === "ArrowLeft" ? step(view.b, view.c, -1) : null;
    if (s) go(s[0], s[1]);
  });

  // Route from the URL: #bookmarks, #<book>-<chapter>[.<verse>], or the contents page.
  function route() {
    const hash = location.hash.slice(1);
    const m = hash.match(/^(.+)-(\d+)(?:\.(\d+))?$/);
    const b0 = m ? BOOKS.findIndex((bk) => bk.s === m[1]) : -1;
    if (hash === "bookmarks") return go("bm");
    if (b0 >= 0 && BOOKS[b0].c[+m[2] - 1]) {
      fillChapters(b0);
      const v0 = m[3] ? +m[3] - 1 : null;
      return v0 != null && BOOKS[b0].c[+m[2] - 1][v0] ? goVerse(b0, +m[2] - 1, v0) : go(b0, +m[2] - 1);
    }
    go(null);
  }
  $("m-abr").setAttribute("aria-pressed", mode === "abr");
  $("m-full").setAttribute("aria-pressed", mode === "full");
  saveMarks();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
